<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Counter App</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .app {
      background: #fff;
      padding: 2.5rem 3rem;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      text-align: center;
      min-width: 320px;
    }
    h1 { margin: 0 0 1.5rem; font-size: 1.4rem; color: #333; }
    .count {
      font-size: 5rem;
      font-weight: 700;
      color: #4f46e5;
      margin: 1rem 0;
      font-variant-numeric: tabular-nums;
    }
    .buttons {
      display: flex;
      gap: 0.6rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      padding: 0.7rem 1.2rem;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
    }
    button:hover { background: #4338ca; }
    button:active { transform: scale(0.96); }
    button.secondary { background: #6b7280; }
    button.secondary:hover { background: #4b5563; }
    button.danger { background: #ef4444; }
    button.danger:hover { background: #dc2626; }
  </style>
</head>
<body>
  <div class="app">
    <h1>Counter</h1>
    <div class="count" id="count">0</div>
    <div class="buttons">
      <button id="dec">− Decrement</button>
      <button id="inc">+ Increment</button>
      <button id="reset" class="danger">Reset</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'counter-value';
    let count = parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10);

    const display = document.getElementById('count');
    const inc = document.getElementById('inc');
    const dec = document.getElementById('dec');
    const reset = document.getElementById('reset');

    function render() {
      display.textContent = count;
      localStorage.setItem(STORAGE_KEY, String(count));
    }

    inc.addEventListener('click', () => { count++; render(); });
    dec.addEventListener('click', () => { count--; render(); });
    reset.addEventListener('click', () => { count = 0; render(); });

    render();
  </script>
</body>
</html>
